name: optimization-for-ml

# Required baseline runs on each main commit and every pull request.
# Path-scoped workflows may remain as additional specialized checks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r optimization_for_machine_learning/requirements.txt
      - name: Run optimization track tests
        run: pytest -q optimization_for_machine_learning/tests
      - name: Run benchmark smoke test
        run: python optimization_for_machine_learning/08_optimizer_benchmarks/benchmark_logistic.py